# Publish the portfolio to GitHub Pages: the files as they are (no build step), plus the
# storage bar (health.svg) that README.md shows. Live at https://ethan-gueck.github.io/
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site (everything except the repo's own tooling)
        run: rsync -a --exclude '.git*' --exclude '.github' --exclude 'tools' ./ _site/
      - run: python3 .github/site_health.py _site   # health.svg: the README's storage bar
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
